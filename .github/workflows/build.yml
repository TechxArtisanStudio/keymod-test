name: Build and Package

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: keymod-test-macos
            executable_name: KeymodTest
            use_onefile: false
          - os: windows-latest
            artifact_name: keymod-test-windows
            executable_name: KeymodTest.exe
            use_onefile: true
          - os: ubuntu-latest
            artifact_name: keymod-test-linux
            executable_name: keymod-test
            use_onefile: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (macOS - onedir for .app bundle)
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name "KeymodTest" \
            --paths src \
            --add-data "src/config.py:." \
            --hidden-import "bleak.backends.corebluetooth" \
            --hidden-import "bleak.backends.corebluetooth.CentralManagerDelegate" \
            --hidden-import "bleak.backends.corebluetooth.PeripheralDelegate" \
            --hidden-import "bleak.backends.corebluetooth.scanner" \
            --hidden-import "bleak.backends.corebluetooth.client" \
            --hidden-import "PyQt6.QtCore" \
            --hidden-import "PyQt6.QtWidgets" \
            --hidden-import "PyQt6.QtGui" \
            --hidden-import "qasync" \
            --hidden-import "ui" \
            --hidden-import "ui.main_window" \
            --hidden-import "ui.scan_panel" \
            --hidden-import "ui.command_panel" \
            --hidden-import "ui.ble_name_panel" \
            --hidden-import "ui.ecm_test_panel" \
            --hidden-import "ui.widgets" \
            --hidden-import "ui.command_palette" \
            --hidden-import "ble" \
            --hidden-import "ble.scanner" \
            --hidden-import "ble.client" \
            --hidden-import "protocol" \
            --hidden-import "protocol.ch9329" \
            --hidden-import "protocol.models" \
            --hidden-import "config" \
            --osx-bundle-identifier com.techxartisanstudio.keymodtest \
            src/main.py

      - name: Build with PyInstaller (Windows - onefile for single exe)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "KeymodTest" `
            --paths src `
            --add-data "src/config.py;." `
            --hidden-import "bleak.backends.winrt" `
            --hidden-import "bleak.backends.winrt.scanner" `
            --hidden-import "bleak.backends.winrt.client" `
            --hidden-import "PyQt6.QtCore" `
            --hidden-import "PyQt6.QtWidgets" `
            --hidden-import "PyQt6.QtGui" `
            --hidden-import "qasync" `
            --hidden-import "ui" `
            --hidden-import "ui.main_window" `
            --hidden-import "ui.scan_panel" `
            --hidden-import "ui.command_panel" `
            --hidden-import "ui.ble_name_panel" `
            --hidden-import "ui.ecm_test_panel" `
            --hidden-import "ui.widgets" `
            --hidden-import "ui.command_palette" `
            --hidden-import "ble" `
            --hidden-import "ble.scanner" `
            --hidden-import "ble.client" `
            --hidden-import "protocol" `
            --hidden-import "protocol.ch9329" `
            --hidden-import "protocol.models" `
            --hidden-import "config" `
            src/main.py

      - name: Build with PyInstaller (Linux - onefile for single binary)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pyinstaller --noconfirm --onefile --windowed \
            --name "keymod-test" \
            --paths src \
            --add-data "src/config.py:." \
            --hidden-import "bleak.backends.bluezdbus" \
            --hidden-import "bleak.backends.bluezdbus.scanner" \
            --hidden-import "bleak.backends.bluezdbus.client" \
            --hidden-import "PyQt6.QtCore" \
            --hidden-import "PyQt6.QtWidgets" \
            --hidden-import "PyQt6.QtGui" \
            --hidden-import "qasync" \
            --hidden-import "ui" \
            --hidden-import "ui.main_window" \
            --hidden-import "ui.scan_panel" \
            --hidden-import "ui.command_panel" \
            --hidden-import "ui.ble_name_panel" \
            --hidden-import "ui.ecm_test_panel" \
            --hidden-import "ui.widgets" \
            --hidden-import "ui.command_palette" \
            --hidden-import "ble" \
            --hidden-import "ble.scanner" \
            --hidden-import "ble.client" \
            --hidden-import "protocol" \
            --hidden-import "protocol.ch9329" \
            --hidden-import "protocol.models" \
            --hidden-import "config" \
            src/main.py

      # ── Package & Upload ─────────────────────────────────────────
      # 直接上传 dist/ 目录（onedir 模式）或 dist/ 可执行文件（onefile 模式）
      # GitHub Actions 会自动打包为 ZIP 供下载，解压即得“可直接运行”的目录结构
      # 仅在 tag 触发时额外生成发布包（DMG / ZIP / tar.gz）

      - name: Prepare artifact for macOS
        if: matrix.os == 'macos-latest'
        run: |
          # onedir 输出在 dist/KeymodTest.app
          # 直接上传整个 .app 目录
          echo "Artifact path: dist/KeymodTest.app"

      - name: Prepare artifact for Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # onefile 输出在 dist/KeymodTest.exe
          # 直接上传 exe 文件
          echo "Artifact path: dist/KeymodTest.exe"

      - name: Prepare artifact for Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          # onefile 输出在 dist/keymod-test
          chmod +x dist/keymod-test
          echo "Artifact path: dist/keymod-test"

      - name: Upload artifact (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/KeymodTest.app
          retention-days: 30

      - name: Upload artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/KeymodTest.exe
          retention-days: 30

      - name: Upload artifact (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/keymod-test
          retention-days: 30

      # ── Release Assets (only on tags) ────────────────────────────
      - name: Create macOS DMG (release)
        if: matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/')
        run: |
          hdiutil create -volname "KeymodTest" -srcfolder dist/KeymodTest.app -ov -format UDZO KeymodTest-macos.dmg
          echo "DMG created: $(ls -lh KeymodTest-macos.dmg)"

      - name: Create Windows ZIP (release)
        if: matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          # 创建发布 ZIP：包含 exe + 说明文件
          New-Item -ItemType Directory -Force -Path dist/KeymodTest-release | Out-Null
          Copy-Item dist/KeymodTest.exe dist/KeymodTest-release/
          # 可选：添加 README
          "Keymod BLE Tester - Windows Release`n双击 KeymodTest.exe 即可运行" | Out-File -Encoding UTF8 dist/KeymodTest-release/README.txt
          Compress-Archive -Path "dist/KeymodTest-release/*" -DestinationPath "KeymodTest-windows.zip"
          $file = Get-Item KeymodTest-windows.zip
          Write-Host "Release ZIP: $($file.Name) - $([math]::Round($file.Length / 1MB, 2)) MB"

      - name: Create Linux tar.gz (release)
        if: matrix.os == 'ubuntu-latest' && startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p dist/keymod-test-release
          cp dist/keymod-test dist/keymod-test-release/
          echo "Keymod BLE Tester - Linux Release" > dist/keymod-test-release/README.txt
          echo "运行: ./keymod-test" >> dist/keymod-test-release/README.txt
          tar -czf KeymodTest-linux.tar.gz -C dist/keymod-test-release .
          echo "Release archive: $(ls -lh KeymodTest-linux.tar.gz)"

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            KeymodTest-macos.dmg
            KeymodTest-windows.zip
            KeymodTest-linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## 📦 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build completed for all platforms." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts (download from Actions page)" >> $GITHUB_STEP_SUMMARY
          echo "- **macOS**: `keymod-test-macos` — 解压后得到 `KeymodTest.app`，双击运行" >> $GITHUB_STEP_SUMMARY
          echo "- **Windows**: `keymod-test-windows` — 直接得到 `KeymodTest.exe`，双击运行" >> $GITHUB_STEP_SUMMARY
          echo "- **Linux**: `keymod-test-linux` — 直接得到 `keymod-test`，赋予执行权限后运行" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **提示**：下载 Artifact 后解压即可直接使用，无需二次解压" >> $GITHUB_STEP_SUMMARY